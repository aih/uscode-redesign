[project]
name = "uscode-redesign"
version = "0.1.0"
description = "Versioned US Code retrieval site: any provision, at any release point"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "diff-match-patch>=20241021",
    "fastapi>=0.140.7",
    "lxml>=6.1.1",
    "opensearch-py>=3.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=6",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
# The HF dataset export/upload (ADR-0069). A separate group so the API image
# and plain `uv sync` don't grow by pyarrow; Makefile targets and CI's Python
# job pass --group dataset.
dataset = [
    "huggingface-hub>=0.35",
    "pyarrow>=21",
]
dev = [
    "fakeredis>=2.37.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The default run never parses the 32 MB samples (CLAUDE.md test speed rule).
addopts = "-m 'not slow'"
markers = [
    "slow: parses the full-size USLM samples; run with `make test-slow`",
    "integration: needs Postgres with Title 16 loaded; skips when absent",
]
