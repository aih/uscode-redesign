{% extends "base.html" %}
{% block content %}
<h1>{{ status }} — {{ headline }}</h1>
<p class="note">{{ detail }}</p>
{% if candidates %}
<ul class="toc">
  {%- for candidate in candidates %}
  <li><a href="?release={{ candidate }}"><span class="num">{{ candidate }}</span>
    <span class="heading">use this release point</span></a></li>
  {%- endfor %}
</ul>
{% endif %}
<p class="formats"><a href="/">Start from the top</a></p>
{% endblock %}
