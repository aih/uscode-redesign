# Deploy to the site box (ADR-0020) after CI goes green on main, or on demand.
#
# Builds both images natively on arm64 (the box is Graviton — no QEMU cross-
# build tax), pushes to ECR, then hands off to deploy/deploy-on-box.sh over
# SSM: pull -> migrate with the new image before it serves -> up -d --wait ->
# prune. The box checks out the exact commit this workflow built.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 739065237548.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    # AWS_DEPLOY_ROLE_ARN is set once deploy/admin-grant.sh has been run and
    # the box exists. Until then this job skips rather than failing every
    # merge to main on a credentials step that cannot succeed yet.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Resolve sha
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/uscode-api:${{ steps.sha.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/uscode-api:latest
          cache-from: type=gha,scope=uscode-api
          cache-to: type=gha,mode=max,scope=uscode-api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/uscode-frontend:${{ steps.sha.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/uscode-frontend:latest
          cache-from: type=gha,scope=uscode-frontend
          cache-to: type=gha,mode=max,scope=uscode-frontend

      - name: Deploy on the box via SSM
        id: dispatch
        run: |
          SHA="${{ steps.sha.outputs.sha }}"

          # Resolve the instance from its tag here rather than targeting the
          # tag in send-command. A tag-targeted command reports an EMPTY
          # Commands[0].InstanceIds forever, so there is no id to poll
          # get-command-invocation with, and the deploy "fails" while the box
          # is running it perfectly well. Targeting by id keeps the tag
          # condition on the IAM policy satisfied either way.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=uscode-site" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "no running instance tagged Name=uscode-site" >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          # Build the inner command with plain bash interpolation, then let
          # jq --arg do all the JSON/quote escaping — no manual quote
          # concatenation to get wrong.
          INNER="cd ~/uscode-redesign && git fetch origin && git checkout --force ${SHA} && bash deploy/deploy-on-box.sh ${SHA}"
          REMOTE_CMD="sudo -iu ec2-user bash -c '${INNER}'"
          PARAMS=$(jq -n --arg cmd "$REMOTE_CMD" \
            '{commands: [$cmd], executionTimeout: ["1800"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $SHA" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $COMMAND_ID to $INSTANCE_ID for deploy of $SHA"

      - name: Wait for the box to finish
        run: |
          COMMAND_ID="${{ steps.dispatch.outputs.command_id }}"
          INSTANCE_ID="${{ steps.dispatch.outputs.instance_id }}"
          echo "Polling command $COMMAND_ID on instance $INSTANCE_ID"

          STATUS="InProgress"
          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ]; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            echo "status: $STATUS"
          done

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")
          STDOUT=$(echo "$INVOCATION" | jq -r ".StandardOutputContent")
          STDERR=$(echo "$INVOCATION" | jq -r ".StandardErrorContent")

          case "$STATUS" in
            Success)
              echo "=== stdout ==="
              echo "$STDOUT"
              ;;
            Failed | Cancelled | TimedOut)
              echo "=== stdout ==="
              echo "$STDOUT"
              echo "=== stderr ==="
              echo "$STDERR"
              echo "Deploy command ended in status $STATUS" >&2
              exit 1
              ;;
            *)
              echo "=== stdout ==="
              echo "$STDOUT"
              echo "=== stderr ==="
              echo "$STDERR"
              echo "Unexpected terminal status $STATUS" >&2
              exit 1
              ;;
          esac
