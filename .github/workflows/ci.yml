# Until this existed, every test count in BUILDLOG.md was the authoring
# session's own claim ("test counts remain the sessions' claims until CI
# exists"). This is the independent machine that re-runs them.
#
# Three suites, all required. `make test` covers Python; since the Jinja reader
# retired, reader coverage lives in `make test-web` (ADR-0015); and since
# Session 10 `make test-e2e` covers what only a browser can answer — hover
# timing, the top layer, sticky geometry, and the WCAG 1.4.13 clauses of the
# citation preview (ADR-0024).
#
# Nothing here touches uscode.house.gov. The fixture data is committed and
# loaded by `make ci-data` — see the comment on that target.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # The full-sample parser tests parse the 32 MB usc16.xml; nightly, not per push.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: make test (Postgres 16)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: uscode
          POSTGRES_PASSWORD: uscode
          POSTGRES_DB: uscode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uscode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://uscode:uscode@localhost:5432/uscode
      # The API integration tests skip themselves when the database isn't
      # loaded. In CI that would be a green run that tested nothing, so here
      # absence is a failure instead — see tests/conftest.py::_unavailable.
      USC_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --group dataset so the HF export integration test runs rather than
      # skipping on a missing pyarrow (ADR-0069).
      - run: uv sync --frozen --group dataset

      - name: Load the fixture corpus (offline)
        run: make ci-data

      - run: make test

  web:
    name: make test-web (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

  e2e:
    name: make test-e2e (Playwright)
    runs-on: ubuntu-latest

    # What only a browser can answer (Session 10): the citation preview's three
    # WCAG 1.4.13 clauses, `position: sticky` geometry, the `scroll-margin-top`
    # that keeps a deep-linked provision out from behind the sticky bar, and the
    # citation box end to end. Vitest cannot see any of it.
    #
    # This runs the real shape — two processes behind Caddy (ADR-0015) — via
    # docker compose, rather than a second and lying copy of the deployment.
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen

      # docker-compose.yml interpolates the WHOLE file before it decides which
      # service to start, so `up -d db` fails on the OpenSearch service's
      # `${SEARCH_PASSWORD:?}` just as surely as `up -d` does. Since Session 13
      # removed the committed default (that was the point), CI has to supply
      # one — generated per run rather than written into this file, which would
      # put the credential back in the repository under a different name.
      #
      # The security plugin rejects a weak password and one containing "admin",
      # and the container exits 1 at boot if either holds.
      - name: Generate the ephemeral search credential
        run: |
          printf 'SEARCH_PASSWORD=%s\n' \
            "Ci$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')!7q" >> .env

      # `--wait` is load-bearing: without it `up -d` returns as soon as the
      # container is *started*, and the next step ran `alembic upgrade` into the
      # middle of initdb — "server closed the connection unexpectedly". The
      # service has a healthcheck; this is what makes anything read it.
      - name: Start Postgres
        run: docker compose up -d --wait db

      - name: Load the fixture corpus (offline)
        env:
          DATABASE_URL: postgresql+psycopg://uscode:uscode@localhost:5432/uscode
        run: make ci-data

      - name: Bring the site up as deployed
        run: docker compose up -d --build

      # `make ci-data` runs before the cluster exists, and ingest is allowed to
      # run without one (DISABLE_SEARCH_SYNC / SearchNotConfigured), so nothing
      # has indexed the fixture corpus at this point. An index that does not
      # exist is a 404 from OpenSearch, which the reader renders as a failure
      # panel — and `chrome.spec.ts` asserts on the *zero-results* panel, which
      # is a different thing. Build it: Title 16 alone, seconds.
      - name: Build the search index
        env:
          DATABASE_URL: postgresql+psycopg://uscode:uscode@localhost:5432/uscode
          SEARCH_URL: https://localhost:9200
          SEARCH_VERIFY_CERTS: "false"
        run: |
          set -a; . ./.env; set +a
          uv run python -m ingest.reindex_search --recreate

      - name: Wait for the reader
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/app/us/usc/t16/s45f > /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the site never came up"; docker compose logs --tail 50; exit 1

      - name: Install the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: frontend
        run: npx playwright test

      - if: failure()
        run: docker compose logs --tail 100

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          # A job that fails *before* Playwright runs leaves no traces, and the
          # default turns that into a second, misleading annotation about the
          # missing directory next to the real failure.
          if-no-files-found: ignore

  compose:
    name: deploy config validates
    runs-on: ubuntu-latest

    # Nothing currently parses the prod compose file before a deploy. Cheap
    # and fast: `config` resolves interpolation and merge without building or
    # starting anything, so a required-var typo or YAML error is caught here
    # rather than at 2am on the box.
    env:
      SITE_ADDRESS: x
      POSTGRES_PASSWORD: x
      SEARCH_PASSWORD: x

    steps:
      - uses: actions/checkout@v5

      - run: docker compose -f docker-compose.prod.yml config -q

      # The Caddyfile had the same gap and a worse consequence: it is a bind
      # mount, so a syntax error in it is not caught by building an image or
      # by the compose parse above — it surfaces as a proxy that will not
      # start, taking both surfaces with it, after the deploy has already
      # replaced the running config. `validate` adapts the Caddyfile to JSON
      # and provisions the modules without binding a port.
      - name: deploy/Caddyfile validates
        run: |
          docker run --rm -e SITE_ADDRESS \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # What the slow suite covers. It is off the per-push path by design — it
  # parses the 32 MB usc16.xml — but a parser change should be measured before
  # it merges rather than at 06:17 the next morning.
  scope:
    name: what the diff touches
    runs-on: ubuntu-latest
    outputs:
      parser: ${{ steps.diff.outputs.parser }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            range="HEAD~1 HEAD"      # a push to main: the push itself
          else
            range="origin/main...HEAD"   # a branch or a PR: the diff from main
          fi
          files=$(git diff --name-only $range)
          echo "$files"
          pattern='^(ingest/|samples/|tests/fixtures/|tests/test_uslm_full_corpus\.py)'
          if echo "$files" | grep -qE "$pattern"; then
            echo "parser=true" >> "$GITHUB_OUTPUT"
          else
            echo "parser=false" >> "$GITHUB_OUTPUT"
          fi

  slow:
    name: make test-slow (full samples)
    needs: scope
    # Nightly, on demand, and on a diff that reaches the parsers or their
    # fixtures. Not on every push: it is ~15 s of tests behind a minute of
    # setup, against a suite that is already three required jobs.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.scope.outputs.parser == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: make test-slow

  # A scheduled run has no author watching it: test_parsing_32_mb_stays_memory_bounded
  # failed here every night for a month with nobody the wiser. A red nightly
  # therefore files an issue, and a later one comments on the issue already open.
  nightly-report:
    name: report a failed nightly
    needs: [python, web, e2e, compose, slow]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    permissions:
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Scheduled CI is failing

    steps:
      - name: open or update the issue
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label nightly --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n%s\n' \
            "Scheduled run of $GITHUB_WORKFLOW failed on \`$GITHUB_SHA\`." "$RUN_URL")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create nightly --repo "$GITHUB_REPOSITORY" \
              --description "A scheduled CI run failed" --color B60205 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label nightly --body "$body"
          fi
