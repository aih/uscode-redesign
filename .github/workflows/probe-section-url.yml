# Temporary: captures uscode.house.gov's per-section address for ADR-0095.
# Removed before PR #98 is ready.
name: probe section url
on:
  push:
    branches: [claude/project-thread-qixcfo]
    paths: [.github/workflows/probe-section-url.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        shell: bash
        run: |
          set +e
          UA="uscode-redesign ingest (https://github.com/aih/uscode-redesign)"
          mkdir -p out
          i=0
          probe() {  # url accept
            i=$((i+1))
            echo "=================== [$i] $1  Accept: $2"
            curl -sS -L --max-redirs 10 -A "$UA" -H "Accept: $2" \
              -D "out/$i.headers" -o "out/$i.body" \
              -w 'final=%{url_effective} code=%{http_code} type=%{content_type} size=%{size_download} redirects=%{num_redirects}\n' "$1"
            grep -iE '^(HTTP/|location:|content-type:)' "out/$i.headers"
            echo "--- first 1500 bytes"
            head -c 1500 "out/$i.body"; echo
            echo "--- hrefs mentioning xml/uslm/download/pl"
            grep -oiE '(href|src)="[^"]*(xml|uslm|download|zip|/pl/|pl[0-9]|format|print)[^"]*"' "out/$i.body" | sort -u | head -80
            sleep 1
          }
          H="text/html"
          X="application/xml, text/xml;q=0.9, */*;q=0.1"
          B=https://uscode.house.gov
          probe $B/us/usc/119-134/t26/s501/ "$H"
          probe $B/us/usc/119-134/t26/s501/ "$X"
          probe $B/us/usc/119-134/t16/s2201/ "$H"
          probe $B/us/usc/119-134/t16/s45a-1/ "$H"
          probe $B/us/usc/119-133/t26/s501/ "$H"
          probe $B/us/usc/119-102not101/t16/s2201/ "$H"
          probe $B/us/usc/119-134/t26/ "$H"
          probe $B/us/usc/119-134/t16/frontmatter/ "$H"
          probe $B/priorreleasepoints.html "$H"
          echo "=================== zip heads"
          for z in xml_usc16@119-134.zip xml_uscAll@119-134.zip; do
            curl -sSI -A "$UA" "$B/download/releasepoints/us/pl/119/134/$z" | grep -iE '^(HTTP/|content-type|content-length|last-modified)'
          done
          echo "=================== full bodies, gzip+base64"
          for n in $(seq 1 9); do echo "### body $n"; gzip -9c "out/$n.body" | base64 -w0; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out
