# Temporary: prints the OIDC token's identifying claims so an IAM trust policy
# can be written against what GitHub actually sends, rather than what the docs
# suggest it sends. Delete once the deploy role assumes cleanly.
#
# Prints claims only — never the token itself, which is a credential.
name: OIDC debug

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show the claims AWS will match on
        run: |
          TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')"
          PAYLOAD="$(echo "$TOKEN" | cut -d. -f2)"
          # base64url -> base64, and pad to a multiple of 4
          PAYLOAD="$(echo "$PAYLOAD" | tr '_-' '/+')"
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref, event_name, workflow_ref}'
