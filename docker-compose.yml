# The whole site: Postgres, the API, the reader, and the proxy that makes them
# look like one origin (ADR-0010, ADR-0011).
#
#   browser :8000 ── proxy ─┬── /app/*  → frontend:4321   (Astro SSR on Node)
#                           └── /*      → api:8001        (FastAPI)
#
# `make dev` runs only the API, locally, for API work. This file is the full
# thing, and the only way to see the citation URL redirect into the reader.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uscode
      POSTGRES_PASSWORD: uscode
      POSTGRES_DB: uscode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uscode"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      # From .env (copy .env.example), never a literal in this file — the same
      # value used to appear three times here and once as a default in
      # storage/search.py, which made it a committed credential rather than a
      # dev convenience.
      #
      # The security plugin rejects a password that resembles the username, so
      # it must not contain "admin" — the container exits 1 at boot if it does,
      # and the only sign is a line in its log.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SEARCH_PASSWORD:?set SEARCH_PASSWORD in .env}
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    # `-f` is load-bearing: without it curl exits 0 on an HTTP 401, so a cluster
    # that rejects the credential reports *healthy* and `depends_on` lets the API
    # start against it. Observed exactly that — OPENSEARCH_INITIAL_ADMIN_PASSWORD
    # is honoured only on FIRST boot, so changing it in .env leaves the security
    # index in the volume holding the old one, and every search 401s behind a
    # green healthcheck.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -skf -u admin:\"$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://uscode:uscode@db:5432/uscode
      SEARCH_URL: https://opensearch:9200
      SEARCH_PASSWORD: ${SEARCH_PASSWORD:?set SEARCH_PASSWORD in .env}
      # False *only here*. The image generates a self-signed certificate at
      # first boot, so verification cannot succeed against the dev stack. Every
      # other environment leaves this at its default of true.
      SEARCH_VERIFY_CERTS: "false"
    expose:
      - "8001"
    volumes:
      - .:/app
    # --proxy-headers makes request.url.scheme the *client's* scheme rather than
    # the http of Caddy's hop to here, which is what decides whether the session
    # cookie carries `Secure` (api/auth.py, ADR-0019). Trusting `*` is safe only
    # because port 8001 is `expose`d, not published: nothing outside this compose
    # network can reach it to forge the header.
    command:
      [
        "uv", "run", "python", "-m", "uvicorn",
        "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload",
        "--proxy-headers", "--forwarded-allow-ips", "*",
      ]

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      # Server-side rendering calls the API by service name, inside the network;
      # the browser never talks to it directly (ADR-0011).
      API_BASE_URL: http://api:8001
      HOST: 0.0.0.0
      PORT: "4321"
    expose:
      - "4321"

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  caddydata:
  osdata:
