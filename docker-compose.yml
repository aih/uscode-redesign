# The whole site: Postgres, the API, the reader, and the proxy that makes them
# look like one origin (ADR-0010, ADR-0011).
#
#   browser :8000 ── proxy ─┬── /app/*  → frontend:4321   (Astro SSR on Node)
#                           └── /*      → api:8001        (FastAPI)
#
# `make dev` runs only the API, locally, for API work. This file is the full
# thing, and the only way to see the citation URL redirect into the reader.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uscode
      POSTGRES_PASSWORD: uscode
      POSTGRES_DB: uscode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uscode"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://uscode:uscode@db:5432/uscode
    expose:
      - "8001"
    volumes:
      - .:/app
    # --proxy-headers makes request.url.scheme the *client's* scheme rather than
    # the http of Caddy's hop to here, which is what decides whether the session
    # cookie carries `Secure` (api/auth.py, ADR-0019). Trusting `*` is safe only
    # because port 8001 is `expose`d, not published: nothing outside this compose
    # network can reach it to forge the header.
    command:
      [
        "uv", "run", "python", "-m", "uvicorn",
        "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload",
        "--proxy-headers", "--forwarded-allow-ips", "*",
      ]

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      # Server-side rendering calls the API by service name, inside the network;
      # the browser never talks to it directly (ADR-0011).
      API_BASE_URL: http://api:8001
      HOST: 0.0.0.0
      PORT: "4321"
    expose:
      - "4321"

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  caddydata:
