# The deployed site (ADR-0020). A complete file, used *instead of*
# docker-compose.yml, not layered over it:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Standalone deliberately. Compose merges `ports` by appending, so an overlay
# cannot take a published port away — the base file's `5432:5432` would survive
# into production and put the whole database on a public IP. A separate file
# cannot make that mistake.
#
#   browser :443 ── proxy ─┬── /app/*  → frontend:4321   (Astro SSR on Node)
#                          └── /*      → api:8001        (FastAPI)
#
# Required in .env beside this file:
#   SITE_ADDRESS=uscode.example.org      the hostname Caddy answers on
#   POSTGRES_PASSWORD=…                  openssl rand -base64 32
#   SEARCH_PASSWORD=…                    openssl rand -base64 24, no "admin" in it
#   DATA_ROOT=/var/lib/uscode            the mounted data volume
#   USC_MIRROR_BUCKET=…                  the S3 corpus mirror (ADR-0013)
#
# Optional in .env:
#   ECR_REGISTRY=…                       pull api/frontend images from here instead of
#                                         building locally; unset falls back to `local`,
#                                         which `build:` still produces on `up --build`
#   IMAGE_TAG=…                          tag to pull/build; defaults to `latest`
#   OPENSEARCH_HEAP=2g                   -Xms/-Xmx for the opensearch JVM; defaults to 2g
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uscode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: uscode
    # No published ports: the database is reachable only from this network.
    volumes:
      - ${DATA_ROOT:-/var/lib/uscode}/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    shm_size: 1gb # index builds during load-all outgrow the 64 MB default
    command:
      - postgres
      - -c
      - max_wal_size=4GB # the bulk load writes in long bursts
      - -c
      - checkpoint_timeout=15min
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uscode"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keyword search (ADR-0028). This service was missing from this file entirely
  # while `docker-compose.yml` had it, so a deploy set neither SEARCH_URL nor
  # SEARCH_PASSWORD and `storage/search.py` fell back to https://localhost:9200
  # with the password committed to the repository — search was simply broken in
  # production, and would have been broken insecurely.
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      # The security plugin rejects a password resembling the username: no
      # "admin" in it, or the container exits 1 at boot with only a log line.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SEARCH_PASSWORD:?set SEARCH_PASSWORD in .env}
      # The index is the corpus, not a smoke slice; the 512 MB default heap is
      # not enough to build it. Override with OPENSEARCH_HEAP for a bigger box.
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}
    # No published ports, same rule as the database: reachable only from this
    # network. It holds no certificate a browser would trust and needs none.
    volumes:
      - ${DATA_ROOT:-/var/lib/uscode}/opensearch:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    restart: unless-stopped
    # `-f` is load-bearing: without it curl exits 0 on an HTTP 401, so a cluster
    # that rejects the credential reports *healthy* and `depends_on` lets the API
    # start against it. Observed exactly that — OPENSEARCH_INITIAL_ADMIN_PASSWORD
    # is honoured only on FIRST boot, so changing it in .env leaves the security
    # index in the volume holding the old one, and every search 401s behind a
    # green healthcheck.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -skf -u admin:\"$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api:
    image: ${ECR_REGISTRY:-local}/uscode-api:${IMAGE_TAG:-latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://uscode:${POSTGRES_PASSWORD}@db:5432/uscode
      # Not inferred from the proxied scheme — see ADR-0019. This is the setting
      # that makes the Secure cookie independent of proxy configuration.
      USC_COOKIE_SECURE: "true"
      USC_MIRROR_BUCKET: ${USC_MIRROR_BUCKET:-}
      SEARCH_URL: https://opensearch:9200
      SEARCH_PASSWORD: ${SEARCH_PASSWORD:?set SEARCH_PASSWORD in .env}
      # An explicit, overridable decision rather than a library default.
      #
      # The image generates its own self-signed certificate at first boot, so a
      # stack brought up from this file as written cannot verify it — and a
      # `SEARCH_VERIFY_CERTS` that defaults to true would mean production search
      # fails closed on day one. The connection is between two containers on a
      # private compose network with no published port, so the residual risk is
      # an attacker who is already inside the host.
      #
      # That is a real cost, and it is accepted *here*, in this file, for this
      # deployment — not in `storage/search.py`, where `verify_certs=False` used
      # to be hardcoded and therefore applied to every environment forever.
      # Mount a CA-issued certificate into the opensearch service and set this
      # to true to close it. ADR-0029.
      SEARCH_VERIFY_CERTS: ${SEARCH_VERIFY_CERTS:-false}
    expose:
      - "8001"
    volumes:
      # The corpus, for `mirror pull` and `load-all`. Not the source tree: here
      # the image is the source of truth, unlike the dev bind mount.
      - ${DATA_ROOT:-/var/lib/uscode}/releases:/app/data/releases
      - ${DATA_ROOT:-/var/lib/uscode}/manifests:/app/data/manifests
    restart: unless-stopped
    # No --reload: the image is what runs.
    command:
      [
        "uv", "run", "python", "-m", "uvicorn",
        "main:app", "--host", "0.0.0.0", "--port", "8001",
        "--proxy-headers", "--forwarded-allow-ips", "*",
      ]
    # No curl in python:3.12-slim; urllib is stdlib.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${ECR_REGISTRY:-local}/uscode-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8001
      HOST: 0.0.0.0
      PORT: "4321"
    expose:
      - "4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/app/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      # Caddy reads this as the site address. A bare hostname means automatic
      # HTTPS from Let's Encrypt; the Caddyfile's default of :8000 means plain
      # HTTP, which is the dev stack.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80" # required: the ACME HTTP challenge and the redirect to 443
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/var/lib/uscode}/caddy:/data # certificates outlive the container
    restart: unless-stopped
